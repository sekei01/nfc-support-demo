<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LED表示確認</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container py-4 support-container">

    <div class="alert alert-warning text-center demo-label" role="alert">
      NFCサポートページ 原理試作デモ
    </div>

    <div class="card shadow-sm main-card">
      <div class="card-body p-4">

        <h1 class="h3 text-center mb-2">LED表示を確認</h1>

        <p class="text-center text-secondary mb-4">
          現在のLED表示を選んでください
        </p>

        <div class="d-grid gap-3">

          <a href="#" class="btn btn-outline-success status-button d-flex align-items-center justify-content-start px-4">
            <span class="led led-green"></span>
            緑色で点灯している
          </a>

          <a href="#" class="btn btn-outline-success status-button d-flex align-items-center justify-content-start px-4">
            <span class="led led-green blink"></span>
            緑色で点滅している
          </a>

          <a href="#" class="btn btn-outline-danger status-button d-flex align-items-center justify-content-start px-4">
            <span class="led led-red"></span>
            赤色で点灯している
          </a>

          <a href="#" class="btn btn-outline-danger status-button d-flex align-items-center justify-content-start px-4">
            <span class="led led-red blink"></span>
            赤色で点滅している
          </a>

          <a href="#" class="btn btn-outline-secondary status-button d-flex align-items-center justify-content-start px-4">
            <span class="led led-off"></span>
            LEDが消灯している
          </a>

        </div>

        <div class="d-grid mt-4">
          <a href="index.html" class="btn btn-secondary">
            トップに戻る
          </a>
        </div>

      </div>
    </div>

  </main>

</body>
</html>
